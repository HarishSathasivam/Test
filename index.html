<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        padding: 20px;
        box-sizing: border-box;
    }

    .container {
        text-align: center;
        color: white;
        max-width: 90%;
    }

    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.4rem; }
    p { font-size: 1rem; }

    button {
        padding: 10px 18px;
        margin: 10px;
        font-size: 16px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
    }

    #yesBtn { background-color: #28a745; color: white; }
    #noBtn { background-color: #dc3545; color: white; position: absolute; }

    #finalMessage { display: none; animation: fadeIn 1.5s ease-in-out; }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
    }

    /* ✨ Glow animation */
    .glow {
        animation: glow 1.5s ease-in-out infinite alternate;
        font-weight: bold;
    }

    @keyframes glow {
        from { text-shadow: 0 0 5px #fff, 0 0 10px #ff6b81; }
        to { text-shadow: 0 0 15px #fff, 0 0 25px #ff4757; }
    }

    .hearts {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
    }

    .heart {
        position: absolute;
        color: red;
        animation: floatUp 4s linear infinite;
    }

    @keyframes floatUp {
        from { transform: translateY(100vh); opacity: 1; }
        to { transform: translateY(-10vh); opacity: 0; }
    }

    @media (max-width: 480px) {
        h1 { font-size: 1.5rem; }
        h2 { font-size: 1.2rem; }
        button { font-size: 14px; padding: 8px 14px; }
    }
</style>
</head>
<body>

<div class="container" id="game">
    <h1>Do you love me? 😍</h1>
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 😏</button>
</div>

<div class="container" id="finalMessage">
    <h1>I love you, <span id="herName" class="glow"></span> ❤️</h1>
    <p>I am so lucky to have you in my life 💕</p>
    <h2>Will you go on another date with me? 🌹</h2>
</div>

<div class="hearts" id="hearts"></div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const game = document.getElementById("game");
    const finalMessage = document.getElementById("finalMessage");
    const heartsContainer = document.getElementById("hearts");
    const herNameElement = document.getElementById("herName");

    // 👉 Change her name here
    const herName = "Anu";

    // ✨ Typing effect
    let index = 0;
    function typeName() {
        if (index < herName.length) {
            herNameElement.textContent += herName.charAt(index);
            index++;
            setTimeout(typeName, 120);
        }
    }

    function moveNoButton() {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("touchstart", moveNoButton);
    noBtn.addEventListener("mouseover", moveNoButton);

    yesBtn.addEventListener("click", () => {
        game.style.display = "none";
        finalMessage.style.display = "block";
        typeName();
        createHearts();
    });

    function createHearts() {
        setInterval(() => {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️ " + herName;
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (Math.random() * 15 + 15) + "px";
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }, 300);
    }
</script>

</body>
</html>
