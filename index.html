<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Dhanya ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    border-radius: 25px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    width: 320px;
    color: white;
    position: relative;
}

.fade-in {
    animation: fadeIn 1s ease forwards;
}
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}

body.glow-bg {
    animation: bgPulse 2s infinite alternate;
}
@keyframes bgPulse {
    from { filter: brightness(1); }
    to { filter: brightness(1.2); }
}

/* Image zoom */
.photo {
    width: 100%;
    height: 180px;
    border-radius: 15px;
    object-fit: cover;
    margin-bottom: 15px;
    animation: zoomLoop 10s ease-in-out infinite alternate;
}
@keyframes zoomLoop {
    0% { transform: scale(1); }
    100% { transform: scale(1.15); }
}

/* Buttons */
button {
    padding: 10px 16px;
    margin: 8px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    color: white;
    font-weight: 600;
}

#yesBtn {
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    animation: pulse 1.2s infinite;
}

#noBtn {
    background: #444;
    position: absolute;
}

@keyframes pulse {
    50% { transform: scale(1.15); }
}

/* Glow text */
.glow {
    animation: glow 1.5s infinite alternate;
}
@keyframes glow {
    from { text-shadow: 0 0 10px #fff; }
    to { text-shadow: 0 0 30px #ff1e4d; }
}

/* Heart rain */
.heart {
    position: absolute;
    font-size: 20px;
    animation: fall linear forwards;
}
@keyframes fall {
    from { transform: translateY(-10vh); }
    to { transform: translateY(110vh); opacity: 0; }
}

/* No msg */
.no-message {
    position: absolute;
    font-size: 14px;
    background: rgba(0,0,0,0.4);
    padding: 6px 10px;
    border-radius: 15px;
    animation: fadeMsg 1s forwards;
}
@keyframes fadeMsg {
    30% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-20px); }
}

/* Shake */
@keyframes shake {
  25% { transform: translate(5px, -5px); }
  50% { transform: translate(-5px, 5px); }
}

#finalMessage { display: none; }

#loveText {
    font-size: 14px;
    margin-top: 10px;
    min-height: 60px;
    opacity: 0;
    animation: textFade 2s forwards;
}
@keyframes textFade {
    to { opacity: 1; }
}
</style>
</head>

<body>

<div class="card" id="game">
    <h1>Hey Dhanya 💖</h1>
    <p>I have something special for you...</p>
    <h2>Do you love me? 😍</h2>

    <button id="yesBtn">Yes 💘</button>
    <button id="noBtn">No 🙈</button>
</div>

<div class="card" id="finalMessage">
    <img src="image.jpeg" class="photo">

    <h1 class="glow">I love you, <span id="herName"></span> ❤️</h1>
    <p id="loveText"></p>

    <h2>Stay with me forever? 💍</h2>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const game = document.getElementById("game");
const finalMessage = document.getElementById("finalMessage");
const herNameElement = document.getElementById("herName");
const loveText = document.getElementById("loveText");

const herName = "Dhanya";

const messages = [
  "Please don’t 😢",
  "Are you sure? 🥺",
  "Really?? 😭",
  "Last chance 💔",
  "You can’t say no 😤"
];
let msgIndex = 0;

/* Typing name */
let i = 0;
function typeName() {
    if (i < herName.length) {
        herNameElement.textContent += herName[i];
        i++;
        setTimeout(typeName, 120);
    }
}

/* 💌 UPDATED LOVE LETTER */
const letter = "For so long, you were just a beautiful dream in my heart… And now, it feels unreal that you are finally part of my life. You are my happy place… ❤️";

let j = 0;
function typeLetter() {
    if (j < letter.length) {
        loveText.textContent += letter[j];
        j++;
        setTimeout(typeLetter, 25);
    }
}

/* NO button */
function moveNoButton() {
    const rect = game.getBoundingClientRect();
    const x = Math.random() * (rect.width - 80);
    const y = Math.random() * (rect.height - 40);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    const msg = document.createElement("div");
    msg.className = "no-message";
    msg.innerText = messages[msgIndex];

    msgIndex = (msgIndex + 1) % messages.length;

    msg.style.left = (x + 20) + "px";
    msg.style.top = (y - 10) + "px";

    game.appendChild(msg);
    setTimeout(() => msg.remove(), 1000);
}

noBtn.addEventListener("mouseover", moveNoButton);

/* Effects */
function bigExplosion() {
    document.body.style.animation = "shake 0.5s";
}

/* Heart rain */
function startHeartRain() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random()*2+3)+"s";

        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),5000);
    },120);
}

/* YES click */
yesBtn.addEventListener("click", () => {
    game.style.display = "none";
    finalMessage.style.display = "block";
    finalMessage.classList.add("fade-in");

    document.body.classList.add("glow-bg");

    bigExplosion();
    startHeartRain();

    typeName();
    setTimeout(typeLetter, 500);
});
</script>

</body>
</html>
